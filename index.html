<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GATE Rank">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>GATE CSE · Rank Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Rank Tracker</h1>
      <div class="sub">GATE CSE · 2.5 lakh race · 40,000 qualify</div>
    </div>
    <div class="head-right">
      <div class="days"><b id="daysLeft">--</b><span>days to exam</span></div>
      <div id="saveChip" class="chip">loading</div>
    </div>
  </header>

  <div id="setupBanner" class="banner" hidden>
    Your rank is based on empty data. Fill in what you have done so far: <a href="#" data-go="subjects">Subjects</a>, <a href="#" data-go="mocks">Mocks</a> and <a href="#" data-go="settings">total hours</a>. Until then you are ranked last.
  </div>
  <div id="backupBanner" class="banner warn" hidden></div>

  <main>
    <section class="view active" id="view-rank"></section>
    <section class="view" id="view-log"></section>
    <section class="view" id="view-mocks"></section>
    <section class="view" id="view-subjects"></section>
    <section class="view" id="view-field"></section>
    <section class="view" id="view-settings"></section>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-view="rank" class="active"><i>#</i>Rank</button>
  <button data-view="log"><i>+</i>Log</button>
  <button data-view="mocks"><i>✎</i>Mocks</button>
  <button data-view="subjects"><i>▤</i>Subjects</button>
  <button data-view="field"><i>≡</i>Field</button>
  <button data-view="settings"><i>⚙</i>Data</button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
